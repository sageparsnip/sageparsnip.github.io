<!DOCTYPE html>
<html>
<head>
	<title>Precia Molen DOT Online Demo</title>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<script src="./scripts/jquery-3.6.3.min.js"></script>
	<script src="./scripts/bootstrap.js" type="text/javascript"></script>
	<link rel="stylesheet" href="./scripts/bootstrap.css">
	<style>
		html, body { height: 100%; margin: 0; }

		body {
			display: flex;
			align-items: center;
			justify-content: center;
			background-color: lightgrey;
		}

		/* Wrapper holds the screen and the control panel side by side.
		   --sh is defined here so both children can use it.
		   The screen's width is capped at 62vw, leaving room for the panel. */
		#layout {
			--sh: min(90vh, calc(62vw * 9 / 16));
			--sw: calc(var(--sh) * 16 / 9);

			display: flex;
			align-items: stretch;
			gap: 2vw;
		}

		#DOT-Screen {
			height: var(--sh);
			width: var(--sw);
			overflow: hidden;
		}

		/* Topbar text, sized relative to the screen */
		.t-date {
			font-size: calc(var(--sh) * 0.05);
			color: white;
		}
		.t-weight {
			font-size: calc(var(--sh) * 0.08);
			padding-right: calc(var(--sw) * 0.05);
		}

		/* Body area: 8 "medium line" units tall. 1 unit (--u) = 1/8 of the body height.
		   small = 0.5 unit, medium = 1 unit, large = 2 units, input box / button grid = 4 units */
		#DOTbody {
			--u: calc(var(--sh) * 0.865 / 8);
			display: flex;
			flex-direction: column;
			overflow: hidden;
		}
		.dot-line {
			flex: none;
			width: 100%;
			display: flex;
			align-items: center;
			justify-content: center;
			overflow: hidden;
			text-align: center;
			margin: 0;
			padding: 0;
			line-height: 1.1;
		}
		.tsmall  { font-size: calc(var(--sh) * 0.025); font-weight: 300; }
		.tmedium { font-size: calc(var(--sh) * 0.04);  font-weight: bold; }
		.tlarge  { font-size: calc(var(--sh) * 0.065); font-weight: bolder; }

		/* Text input + confirm tick: together about 80% of the screen width */
		.dot-input {
			width: 80%;
			display: flex;
			align-items: center;
			gap: calc(var(--sh) * 0.015);
		}
		.dot-input input {
			flex: 1;
			min-width: 0;
			height: calc(var(--u) * 0.9);
			background: #d9d9d9;
			color: black;
			border: 0;
			border-radius: 4px;
			padding: 0 .5em;
			font-size: calc(var(--sh) * 0.04);
		}
		.dot-input button {
			flex: none;
			width: calc(var(--u) * 0.9);
			height: calc(var(--u) * 0.9);
			background: #2eaa4f;
			color: white;
			border: 0;
			border-radius: 4px;
			font-size: calc(var(--sh) * 0.04);
			line-height: 1;
		}

		/* Button grid: two rows of four */
		.dot-buttons {
			width: 92%;
			display: grid;
			grid-template-columns: repeat(4, 1fr);
			grid-auto-rows: calc(var(--u) * 1.1);
			gap: calc(var(--u) * 0.3);
		}
		.dot-buttons button {
			background: #d02020;
			color: white;
			border: 0;
			border-radius: calc(var(--sh) * 0.012);
			font-size: calc(var(--sh) * 0.025);
			padding: 0 .3em;
		}
		.dot-buttons button:active { background: #a81818; }

		/* ---------- Control panel ---------- */
		#control-panel {
			height: var(--sh);
			width: min(26vw, 460px);
			min-width: 300px;
			overflow-y: auto;
			background: #2b2f36;
			color: #e8eaed;
			border-radius: 8px;
			padding: 14px;
			font-size: clamp(12px, calc(var(--sh) * 0.02), 16px);
		}
		#control-panel h2 { font-size: 1.3em; margin: 0 0 12px; }
		.cp-section {
			background: #383d46;
			border-radius: 6px;
			padding: 10px;
			margin-bottom: 12px;
		}
		.cp-title { font-weight: 600; margin-bottom: 8px; }

		/* Truck track */
		#road {
			position: relative;
			height: 4.5em;
			background: #555b66;
			border-radius: 4px;
			overflow: hidden;
		}
		#road::after { /* dashed centre line */
			content: "";
			position: absolute;
			left: 0; right: 0; top: 50%;
			border-top: 3px dashed rgba(255,255,255,.35);
		}
		#truck {
			position: absolute;
			top: 50%;
			left: 12.5%;
			font-size: 2.6em;
			line-height: 1;
			transform: translate(-50%, -50%) scaleX(-1); /* emoji faces left; flip to face right */
			transition: left .6s ease-in-out;
			z-index: 2;
		}
		.gate {
			position: absolute;
			top: 0; bottom: 0;
			width: 6px;
			transform: translateX(-50%);
			transform-origin: top;
			background: repeating-linear-gradient(#d33 0 8px, #fff 8px 16px);
			transition: transform .4s;
			z-index: 1;
		}
		.gate.open { transform: translateX(-50%) scaleY(.18); }
		#weighbridge {
			position: absolute;
			top: 0; bottom: 0;
			left: 50%;
			width: 25%;
			background: #7a8290;
			border-left: 3px solid #444;
			border-right: 3px solid #444;
			display: flex;
			align-items: flex-end;
			justify-content: center;
			font-size: 1em;
			line-height: 1;
			padding-bottom: .15em;
			color: #fff;
			z-index: 0;
		}
		#light-dot {
			position: absolute;
			top: 6px; left: 44%;
			width: 1em; height: 1em;
			border-radius: 50%;
			background: #222;
			border: 2px solid #999;
			z-index: 1;
		}
		#light-dot.on { background: #3ddc84; box-shadow: 0 0 10px #3ddc84; }

		#zones {
			display: grid;
			grid-template-columns: repeat(4, 1fr);
			gap: 4px;
			margin-top: 6px;
		}
		.zone {
			background: #454b56;
			color: inherit;
			border: 2px solid transparent;
			border-radius: 4px;
			padding: 6px 2px;
			font-size: .85em;
			line-height: 1.2;
			cursor: pointer;
		}
		.zone:hover { background: #505763; }
		.zone.active { border-color: #ffc83d; background: #5a5230; }

		/* Weight + IO */
		#weight-input { width: 100%; }
		.presets { display: flex; gap: 4px; margin-top: 6px; }
		.presets button { flex: 1; font-size: .85em; }
		.io-row {
			display: flex;
			justify-content: space-between;
			align-items: center;
			padding: 3px 0;
		}
		.io-state {
			min-width: 5.5em;
			text-align: center;
			border-radius: 10px;
			padding: 1px 8px;
			background: #555b66;
			font-weight: 600;
		}
		.io-state.on   { background: #2e9e5b; }
		.io-state.open { background: #2e9e5b; }
		.io-state.closed { background: #b83a3a; }
	</style>
</head>
<body>
<div id="layout">

	<!-- ================= DEVICE SCREEN ================= -->
	<div id="DOT-Screen">
		<div id="topbar" style="height:13.5%;width:100%" class="d-flex">
			<div id="topleft" style="width:35%;height:100%;background-color:red" class="d-flex align-items-center justify-content-center">
				<div class="container-fluid">
					<div class="row align-items-center text-center">
						<div class="col-7">
							<h1 id="date-display" class="m-0 t-date"></h1>
						</div>
						<div class="col-5">
							<h1 class="m-0 t-date"><b id="time-display"></b></h1>
						</div>
					</div>
				</div>
			</div>
			<div id="topright" style="width:65%;height:100%;background-color:black" class="d-flex align-items-center justify-content-end">
				<h1 id="weight-display" class="m-0 text-white text-end t-weight">0kg</h1>
			</div>
		</div>

		<div id="DOTbody" style="height:86.5%;width:100%;background-color:white;color:black">
		
		</div>
	</div>

	<!-- ================= CONTROL PANEL ================= -->
	<div id="control-panel">
		<h2>Control panel</h2>

		<div class="cp-section">
			<div class="cp-title">Truck position</div>
			<div id="road">
				<div id="weighbridge">&#8596;</div>
				<div class="gate" id="gate-entry" style="left:50%"></div>
				<div class="gate" id="gate-exit" style="left:75%"></div>
				<div id="light-dot"></div>
				<div id="truck">🚚</div>
			</div>
			<div id="zones">
				<button class="zone" data-pos="0">On road</button>
				<button class="zone" data-pos="1">Approaching weighbridge</button>
				<button class="zone" data-pos="2">On weighbridge</button>
				<button class="zone" data-pos="3">Left weighbridge</button>
			</div>
		</div>

		<div class="cp-section">
			<div class="cp-title">Truck weight (kg)</div>
			<input id="weight-input" type="number" class="form-control" min="0" step="10" value="0">
			<div class="presets">
				<button class="btn btn-sm btn-secondary" data-weight="0">Empty</button>
				<button class="btn btn-sm btn-secondary" data-weight="8000">8,000</button>
				<button class="btn btn-sm btn-secondary" data-weight="18500">18,500</button>
				<button class="btn btn-sm btn-secondary" data-weight="32000">32,000</button>
			</div>
		</div>

		<div class="cp-section">
			<div class="cp-title">Inputs / outputs</div>
			<div class="io-row"><span>Traffic light</span><span id="io-light" class="io-state">Off</span></div>
			<div class="io-row"><span>Entry barrier</span><span id="io-entry" class="io-state">Closed</span></div>
			<div class="io-row"><span>Exit barrier</span><span id="io-exit" class="io-state">Closed</span></div>
		</div>
		<div class="cp-section">
			<div class="cp-title">Badge reader</div>
			<button id="badge-btn" class="btn btn-primary w-100">Badge Swipe</button>
		</div>
	</div>

</div>

<script>
	/* ------------------------------------------------------------
	   Stages, keyed by name. Call setStage("Name") from anywhere.

	   lines    Array (or a function returning an array) of up to 8 "medium lines":
	              { type: "text",    size: "small" | "medium" | "large", text: "..." }   0.5 / 1 / 2 lines
	              { type: "input",   placeholder: "...", onConfirm: value => {} }       4 lines
	              { type: "buttons", labels: ["A", "B", ...], onSelect: label => {} }   4 lines (max 8)
	            Lines are drawn top to bottom in the order given, so put an input/buttons entry last.
	   io       Optional. Only the outputs listed are changed; the rest keep their current state.
	            light: true = on (green). entry / exit: true = open.
	   next     Optional. { after: milliseconds, stage: "Name" } moves on automatically.
	   onBadge  Optional. Stage name (string) or function, run when "Badge Swipe" is pressed.
	   onEnter  Optional. Function run when the stage starts.
	   ------------------------------------------------------------ */
	const session = {};   // scratch space for the current transaction (product, account, ...)

	const header = { type: "text", size: "small", text: "Precia Molen Weighbridge System" };

	/* ---------- Truck, weight and stage logic ---------- */
	let truckPos = 0;
	let truckWeight = 0;
	let currentStage = null;
	let stageTimer = null;
	let shown = 0;

	const stages = {
		Idle: {
			lines: [
				header,
				{ type: "text", size: "large",  text: "Key Waste" },
				{ type: "text", size: "medium", text: "Waiting for Vehicle" }
			],
			io: { light: false, entry: false, exit: false },
			onEnter: () => Object.keys(session).forEach(k => delete session[k])
		},

		Approaching: {
			lines: [
				header,
				{ type: "text", size: "medium", text: "Vehicle Detected" },
				{ type: "text", size: "medium", text: "Please Wait" },
				{ type: "text", size: "medium", text: "Zeroing Weighbridge" }
			],
			next: { after: 2000, stage: "EntryOpen" }
		},

		EntryOpen: {
			lines: [
				header,
				{ type: "text", size: "large",  text: "Weighbridge Zeroed" },
				{ type: "text", size: "medium", text: "Drive Onto Weighbridge" }
			],
			io: { light: true, entry: true }
		},

		SwipeBadge: {
			lines: [
				header,
				{ type: "text", size: "large", text: "Please Swipe Badge" }
			],
			onBadge: "EnterVehicleReg", //Change this to "EnterVehicleReg" for Vehicle Reg entry
			io: {light:false}
		},

		ConfirmBadge: {
			lines: [
				header,
				{ type: "text", size: "medium", text: "Please Confirm: "},
				{ type: "text", size: "large", text: "Vehicle Reg: 142D12834" },
				{ type: "buttons", labels: ["Yes", "No"], 
				  onSelect: label => { session.vehicleReg = "142D12834"; setStage("SelectProduct");}
				}
			]
		},

		EnterVehicleReg: {
			lines: [
				header,
				{ type: "text", "size":"large", text: "Please Enter Vehicle Reg: "},
				{ type: "input", pleaceholder: "Vehicle Reg", onConfirm: value => {
				session.vehicleReg = value; setStage("SelectProduct");}
				}
			]
		},

		SelectProduct: {
			lines: [
				header,
				{ type: "text", size: "large", text: "Select Product" },
				{ type: "buttons", labels: ["Gravel", "Sand", "Cement", "Topsoil", "Bricks", "Timber"],
				  onSelect: label => { session.product = label; setStage("SelectAccount"); } 
				}
			]
		},

		SelectAccount: {
			lines: () => [
				header,
				{ type: "text", size: "medium", text: "Product: " + session.product },
				{ type: "text", size: "large",  text: "Select Account" },
				{ type: "buttons", labels: ["Acme Ltd", "Byrne Haulage", "Cork Aggregates", "Cash Sale"],
				  onSelect: label => { session.account = label; setStage("ConfirmDetails"); } 
				}
			]
		},

		ConfirmDetails: {
			lines: () => [
				header,
				{ type:"text", size:"medium", text: "Please Confirm: "},
				{ type:"text", size:"medium", text: session.vehicleReg},
				{ type:"text", size:"medium", text: session.account},
				{ type:"text", size:"medium", text: session.product},
				{ type: "buttons", labels: ["Yes", "No"],
				  onSelect: label => { 
				  	if(label == "Yes"){
				  		session.weight = String(truckWeight);
				  		setStage("TakeWeighing");
				  	} else{
				  		setStage("SwipeBadge"); 
				  	} 
				}}
			]
		},

		TakeWeighing: {
			lines: [
				header,
				{ type: "text", size: "large",  text: "Capturing Weight" }
			],
			next: { after: 2000, stage: "GotWeight" }
		},

		GotWeight: {
			lines: [
				header,
				{ type: "text", size: "large",  text: "Weight: " + session.weight + "kg" }
			],
			next: { after: 2000, stage: "Complete" }
		},

		Complete: {
			lines: () => [
				header,
				{ type: "text", size: "large",  text: "Weighing Complete" },
				{ type: "text", size: "medium", text: session.product + " / " + session.account },
				{ type: "text", size: "medium", text: session.product},
				{ type: "text", size: "medium", text: session.weight + "kg" },
				{ type: "text", size: "medium", text: "Please Leave Weighbridge" }
			],
			io: { light: false, exit: true, entry:false }
		}
	};

	/* Stage entered when the truck is moved to each position (On road, Approaching, On bridge, Left) */
	const truckStages = ["Idle", "Approaching", "SwipeBadge", "Idle"];
	const ON_BRIDGE = 2;

	/* ---------- Screen body renderer ---------- */
	const MAX_UNITS = 8;   // capacity of the body, in medium lines
	const UNITS = { small: 0.5, medium: 1, large: 2, input: 4, buttons: 4 };
	const SIZE_CLASS = { small: "tsmall", medium: "tmedium", large: "tlarge" };

	function renderScreen(lines) {
		const body = document.getElementById("DOTbody");
		body.innerHTML = "";
		let used = 0;

		lines.forEach(item => {
			const key = item.type === "text" ? item.size : item.type;
			const units = UNITS[key];
			if (units === undefined) { console.warn("Unknown screen line:", item); return; }
			used += units;

			const row = document.createElement("div");
			row.className = "dot-line";
			row.style.height = "calc(var(--u) * " + units + ")";

			if (item.type === "text") {
				row.classList.add(SIZE_CLASS[item.size]);
				row.textContent = item.text;

			} else if (item.type === "input") {
				const wrap = document.createElement("div");
				wrap.className = "dot-input";
				const input = document.createElement("input");
				input.type = "text";
				input.placeholder = item.placeholder || "";
				const tick = document.createElement("button");
				tick.textContent = "\u2714";
				tick.setAttribute("aria-label", "Confirm");
				const confirm = () => {
					console.log("Input confirmed:", input.value);
					if (item.onConfirm) item.onConfirm(input.value);
				};
				tick.addEventListener("click", confirm);
				input.addEventListener("keydown", e => { if (e.key === "Enter") confirm(); });
				wrap.append(input, tick);
				row.appendChild(wrap);

			} else if (item.type === "buttons") {
				const grid = document.createElement("div");
				grid.className = "dot-buttons";
				item.labels.slice(0, 8).forEach(label => {
					const b = document.createElement("button");
					b.textContent = label;
					b.addEventListener("click", () => {
						console.log("Button selected:", label);
						if (item.onSelect) item.onSelect(label);
					});
					grid.appendChild(b);
				});
				row.appendChild(grid);
			}
			body.appendChild(row);
		});

		if (used > MAX_UNITS) console.warn("Screen content is " + used + " lines; the maximum is " + MAX_UNITS + ".");
	}

	function setIO(name, state) {
		const el = document.getElementById("io-" + name);
		if (name === "light") {
			el.textContent = state ? "On" : "Off";
			el.className = "io-state" + (state ? " on" : "");
			document.getElementById("light-dot").classList.toggle("on", state);
		} else {
			el.textContent = state ? "Open" : "Closed";
			el.className = "io-state " + (state ? "open" : "closed");
			document.getElementById("gate-" + name).classList.toggle("open", state);
		}
	}

	

	// The topbar only shows the truck's weight while the truck is on the bridge; otherwise 0
	function updateWeightDisplay() {
		if(truckPos == ON_BRIDGE){
			shown = truckWeight;
		}
		else{
			shown = 0;
		}
		document.getElementById("weight-display").textContent = shown + "kg";
	}

	function setWeight(kg, fromInput) {
		truckWeight = Math.max(0, Number(kg) || 0);
		if (!fromInput) document.getElementById("weight-input").value = truckWeight;
		updateWeightDisplay();
	}

	function setStage(name) {
		const s = stages[name];
		if (!s) { console.warn("Unknown stage:", name); return; }

		clearTimeout(stageTimer);
		currentStage = name;

		renderScreen(typeof s.lines === "function" ? s.lines() : (s.lines || []));
		if (s.io) Object.entries(s.io).forEach(([io, state]) => setIO(io, state));
		if (s.onEnter) s.onEnter();

		// onEnter may have moved to another stage; if so, that stage owns the timer
		if (currentStage !== name) return;
		if (s.next) stageTimer = setTimeout(() => setStage(s.next.stage), s.next.after);
	}

	function moveTruck(pos) {
		truckPos = pos;
		updateWeightDisplay();
		document.getElementById("truck").style.left = (pos * 25 + 12.5) + "%";
		document.querySelectorAll(".zone").forEach(z =>
			z.classList.toggle("active", Number(z.dataset.pos) === pos));
		updateWeightDisplay();
		setStage(truckStages[pos]);
	}

	function badgeSwipe() {
		const handler = stages[currentStage] && stages[currentStage].onBadge;
		if (typeof handler === "string") setStage(handler);
		else if (typeof handler === "function") handler();
		else console.log("Badge swipe ignored in stage:", currentStage);
	}

	document.querySelectorAll(".zone").forEach(z =>
		z.addEventListener("click", () => moveTruck(Number(z.dataset.pos))));
	document.querySelectorAll("[data-weight]").forEach(b =>
		b.addEventListener("click", () => setWeight(b.dataset.weight)));
	document.getElementById("weight-input").addEventListener("input", e => setWeight(e.target.value, true));
	document.getElementById("badge-btn").addEventListener("click", badgeSwipe);

	/* ---------- Clock: shows the current date (DD/MM/YYYY) and time (HH:MM) ---------- */
	const pad = n => String(n).padStart(2, "0");

	function updateClock() {
		const now = new Date();
		const date = pad(now.getDate()) + "/" + pad(now.getMonth() + 1) + "/" + now.getFullYear();
		const time = pad(now.getHours()) + ":" + pad(now.getMinutes());

		// Only touch the page when the text has actually changed
		const dateEl = document.getElementById("date-display");
		const timeEl = document.getElementById("time-display");
		if (dateEl.textContent !== date) dateEl.textContent = date;
		if (timeEl.textContent !== time) timeEl.textContent = time;
	}

	updateClock();
	setInterval(updateClock, 1000);   // check every second

	moveTruck(0);
	setWeight(0);
</script>
</body>
</html>
